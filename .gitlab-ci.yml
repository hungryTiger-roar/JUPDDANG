stages:
  - build
  - deploy

variables:
  IMAGE_NAME: jupddang-backend
  # 👇 [중요] 서버에 있는 설정 파일을 바라보도록 절대 경로로 수정해야 합니다.
  # (기존 ./docker-compose.yml 은 프로젝트 내부 파일을 보는데, 우리는 서버 설정을 따르기로 했으니까요)
  COMPOSE_FILE: /home/gitlab-runner/app/docker-compose.yml
  ENV_ROOT: /home/gitlab-runner/app

# ==================================================
# 1. Build 단계
# ==================================================
build_image:
  stage: build
  tags:
    - jupddang
  only:
    - master
    - dev
  script:
    - |
      echo "🏗️ Building Docker Image for branch: $CI_COMMIT_REF_SLUG"

      if [ "$CI_COMMIT_REF_SLUG" == "master" ]; then
        ENV_FILE="${ENV_ROOT}/.env.prod"
      else
        ENV_FILE="${ENV_ROOT}/.env.dev"
      fi

      # 빌드용 환경변수 복사
      cp "$ENV_FILE" .env || { echo "❌ Env file not found"; exit 1; }

      # 이미지 빌드
      docker build -t $IMAGE_NAME:$CI_COMMIT_REF_SLUG ./Backend/jupddang

# ==================================================
# 2. Deploy 단계
# ==================================================
deploy_app:
  stage: deploy
  tags:
    - jupddang
  needs: ["build_image"]
  only:
    - master
    - dev
  script:
    - |
      echo "🚀 Deploying to $CI_COMMIT_REF_SLUG Environment..."

      # 👇 [핵심 수정] 브랜치에 따라 'backend-prod' 또는 'backend-dev'를 선택하게 함
      if [ "$CI_COMMIT_REF_SLUG" == "master" ]; then
        TARGET_ENV="${ENV_ROOT}/.env.prod"
        TARGET_SERVICE="backend-prod"   # 여기가 옛날엔 "backend" 였음 -> 수정됨
        IMAGE_TAG="prod"
      else
        TARGET_ENV="${ENV_ROOT}/.env.dev"
        TARGET_SERVICE="backend-dev"    # 여기가 옛날엔 "backend" 였음 -> 수정됨
        IMAGE_TAG="dev"
      fi

      echo "🎯 Target Service: $TARGET_SERVICE | Tag: $IMAGE_TAG"

      # 1. 환경변수 복사
      cp "$TARGET_ENV" .env

      # 2. 이미지 태그 변경 (commit hash -> prod/dev)
      docker tag $IMAGE_NAME:$CI_COMMIT_REF_SLUG $IMAGE_NAME:$IMAGE_TAG

      # 3. 배포 실행
      # (기존 스크립트의 'down backend' 부분이 삭제되고, 아래 한 줄로 통합됨)
      # --no-deps: DB/Redis 재시작 없이 오직 백엔드만 교체
      docker compose --env-file "$TARGET_ENV" -f $COMPOSE_FILE up -d --no-deps --build $TARGET_SERVICE

      docker image prune -f
      echo "✅ Deployment of $TARGET_SERVICE Complete!"