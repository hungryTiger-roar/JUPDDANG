stages:
  - build
  - deploy

variables:
  IMAGE_NAME: jupddang-backend
  COMPOSE_FILE: ./docker-compose.yml

# 1. Build 단계
build_image:
  stage: build
  tags:
    - jupddang
  only:
    - master
    - dev
  script:
    - |
      echo "🏗️ Building Docker Image for branch: $CI_COMMIT_REF_SLUG"

      # 환경별 .env 파일 선택
      if [ "$CI_COMMIT_REF_SLUG" == "master" ]; then
        ENV_FILE="/home/gitlab-runner/app/.env.prod"
      else
        ENV_FILE="/home/gitlab-runner/app/.env.dev"
      fi

      # 빌드 컨텍스트에 .env 복사 (필요 시)
      cp "$ENV_FILE" .env || { echo "❌ Env file not found"; exit 1; }

      # 이미지 빌드
      docker build -t $IMAGE_NAME:$CI_COMMIT_REF_SLUG ./Backend/jupddang

# 2. Deploy 단계
deploy_app:
  stage: deploy
  tags:
    - jupddang
  needs: ["build_image"]
  only:
    - master
    - dev
  script:
    - |
      echo "🚀 Deploying to $CI_COMMIT_REF_SLUG Environment..."

      # 변수 설정
      if [ "$CI_COMMIT_REF_SLUG" == "master" ]; then
        ENV_FILE="/home/gitlab-runner/app/.env.prod"
        PROJECT_NAME="jupddang-prod"
      else
        ENV_FILE="/home/gitlab-runner/app/.env.dev"
        PROJECT_NAME="jupddang-dev"
      fi

      # 실행용 .env 복사
      cp "$ENV_FILE" .env

      # 이미지 태그 갱신
      docker tag $IMAGE_NAME:$CI_COMMIT_REF_SLUG $IMAGE_NAME:latest

      # 배포 실행
      # --env-file: 정확한 환경변수 주입
      # -p: 프로젝트 격리
      docker compose -p $PROJECT_NAME --env-file "$ENV_FILE" -f $COMPOSE_FILE down backend
      docker compose -p $PROJECT_NAME --env-file "$ENV_FILE" -f $COMPOSE_FILE up -d

      docker image prune -f
      echo "✅ Deployment Complete!"