stages:
  - build
  - deploy

variables:
  IMAGE_NAME: jupddang-backend
  COMPOSE_FILE: /home/gitlab-runner/app/docker-compose.yml
  ENV_ROOT: /home/gitlab-runner/app

# ==================================================
# 1. Build 단계
# ==================================================
build_image:
  stage: build
  tags:
    - jupddang
  only:
    - master
    - dev
  script:
    - |
      echo "🏗️ Building Docker Image (NO CACHE) for branch: $CI_COMMIT_REF_SLUG"

      if [ "$CI_COMMIT_REF_SLUG" == "master" ]; then
        ENV_FILE="${ENV_ROOT}/.env.prod"
      else
        ENV_FILE="${ENV_ROOT}/.env.dev"
      fi

      cp "$ENV_FILE" .env || { echo "❌ Env file not found"; exit 1; }

      # --no-cache로 코드 변경사항 확실히 반영
      docker build --no-cache -t $IMAGE_NAME:$CI_COMMIT_REF_SLUG ./Backend/jupddang

# ==================================================
# 2. Deploy 단계 (여기가 중요)
# ==================================================
deploy_app:
  stage: deploy
  tags:
    - jupddang
  needs: ["build_image"]
  only:
    - master
    - dev
  script:
    - |
      echo "🚀 Deploying to $CI_COMMIT_REF_SLUG Environment..."

      if [ "$CI_COMMIT_REF_SLUG" == "master" ]; then
        TARGET_ENV="${ENV_ROOT}/.env.prod"
        TARGET_SERVICE="backend-prod"
        IMAGE_TAG="prod"
      else
        TARGET_ENV="${ENV_ROOT}/.env.dev"
        TARGET_SERVICE="backend-dev"
        IMAGE_TAG="dev"
      fi

      echo "🎯 Target Service: $TARGET_SERVICE | Tag: $IMAGE_TAG"

      # 1. 환경변수 준비
      cp "$TARGET_ENV" .env

      # 2. 이미지 태그 변환 (Build 단계 이미지를 배포용 태그로 변경)
      docker tag $IMAGE_NAME:$CI_COMMIT_REF_SLUG $IMAGE_NAME:$IMAGE_TAG

      # 3. 배포 실행 (강제 재생성 옵션 추가)
      # --force-recreate: 컨테이너를 강제로 지우고 다시 띄움 (Swagger 갱신 필수)
      docker compose --env-file "$TARGET_ENV" -f $COMPOSE_FILE up -d --no-deps --force-recreate $TARGET_SERVICE

      docker image prune -f
      echo "✅ Deployment Complete!"