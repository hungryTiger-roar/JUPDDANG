# 파이프라인 단계 정의
stages:
  - build   # 테스트 및 컴파일 확인
  - deploy  # 실제 배포 및 컨테이너 교체

# 전역 변수 설정
variables:
  # Docker 이미지 이름 설정
  IMAGE_NAME: backend
  # Docker Compose 파일 경로 (루트 기준)
  COMPOSE_FILE: ./docker-compose.yml

# 캐시 설정 (Gradle 빌드 속도 향상 - Runner 내부 캐시 사용)
cache:
  paths:
    - .gradle/
    - build/

# 1. Build & Test 단계 (선택 사항: 배포 전 코드 검증)
build_test:
  stage: build
  tags:
    - jupddang # 서버에 등록한 Runner 태그 이름
  script:
    - echo "Building and Testing..."
    - cd Backend/jupddang
    - chmod +x gradlew
    - ./gradlew test --no-daemon
  only:
    - merge_requests
    - master

# 2. Deploy 단계 (메인 배포 로직)
deploy_prod:
  stage: deploy
  tags:
    - jupddang
  only:
    - master
  script:
    - echo "Starting Deployment..."

    # 1) 버전 관리를 위한 태그 생성 (Git Commit Hash 사용)
    - export IMAGE_TAG=$CI_COMMIT_SHORT_SHA
    - echo "Deploying version: $IMAGE_TAG"

    # 2) 환경 변수 파일(.env) 확인 (서버에 미리 생성되어 있어야 함)
    - if [ ! -f .env ]; then echo "Error: .env file missing on server!"; exit 1; fi

    # 3) Docker 이미지 빌드 (캐시 활용)
    # 기존 latest를 덮어쓰지 않고 태그를 붙여 빌드 -> 롤백 대비
    - docker build -t $IMAGE_NAME:$IMAGE_TAG ./Backend/jupddang

    # 4) 최신 태그(latest) 갱신
    - docker tag $IMAGE_NAME:$IMAGE_TAG $IMAGE_NAME:latest

    # 5) 서비스 재시작 (Zero-downtime은 아니지만 빠른 재시작)
    - docker-compose -f $COMPOSE_FILE down backend
    - docker-compose -f $COMPOSE_FILE up -d backend

    # 6) 이미지 정리 (공간 확보)
    # 사용하지 않는 dangling 이미지 삭제 (현재 실행 중인 이미지는 삭제 안 됨)
    - docker image prune -f

  environment:
    name: production
    url: https://api.jupddang.com