stages:
  - build
  - deploy

variables:
  IMAGE_NAME: jupddang-backend
  COMPOSE_FILE: ./docker-compose.yml

# 1. Build 단계
build_image:
  stage: build
  tags:
    - jupddang
  only:
    - master
  script:
    - |
      echo "🏗️ Building Docker Image..."

      # ---------------------------------------------------------
      # ✅ [문제 해결 로직] 우선순위 체크
      # 1순위: GitLab CI 변수 (미래 확장성)
      # 2순위: 서버 로컬 파일 (현재 해결책)
      # ---------------------------------------------------------
      if [ -n "$PROD_ENV" ]; then
        cp "$PROD_ENV" .env
        echo "✅ Loaded .env from CI/CD Variable"
      elif [ -f "/home/gitlab-runner/.env" ]; then
        cp /home/gitlab-runner/.env .env
        echo "✅ Loaded .env from Server Local File"
      else
        echo "❌ Error: .env file not found anywhere (Neither Variable nor Local path)!"
        exit 1
      fi

      # 이미지 빌드
      docker build -t $IMAGE_NAME:$CI_COMMIT_SHORT_SHA ./Backend/jupddang

# 2. Deploy 단계
deploy_prod:
  stage: deploy
  tags:
    - jupddang
  needs: ["build_image"]
  only:
    - master
  when: manual
  allow_failure: false
  script:
    - |
      echo "🚀 Starting Deployment..."

      docker tag $IMAGE_NAME:$CI_COMMIT_SHORT_SHA $IMAGE_NAME:latest

      # V2 문법 (docker compose)
      docker compose -f $COMPOSE_FILE down backend
      docker compose -f $COMPOSE_FILE up -d backend

      docker image prune -f
      echo "✅ Deployment Complete!"