stages:
  - build
  - deploy

variables:
  IMAGE_NAME: jupddang-backend
  COMPOSE_FILE: ./docker-compose.yml

# 1. Build 단계: 이미지만 생성하고 끝남
build_image:
  stage: build
  tags:
    - jupddang
  only:
    - master
  script:
    - |
      echo "🏗️ Building Docker Image..."

      # [확장성 고려] GitLab CI 변수(PROD_ENV)가 설정되어 있다면 .env로 복사
      # 변수가 아직 없다면 이 부분은 무시되고 넘어감 (에러 방지)
      if [ -n "$PROD_ENV" ]; then
        cp "$PROD_ENV" .env
        echo "✅ Loaded .env from CI/CD Variable"
      else
        echo "⚠️ PROD_ENV variable is not set yet."
      fi

      # .env 파일 존재 여부 최종 확인
      # 변수도 없고, 파일도 없으면 여기서 파이프라인 중단 (안전장치)
      if [ ! -f .env ]; then 
        echo "❌ Error: .env file is missing! Please check CI/CD Variables."
        exit 1
      fi

      # 이미지 빌드
      docker build -t $IMAGE_NAME:$CI_COMMIT_SHORT_SHA ./Backend/jupddang

# 2. Deploy 단계: 수동 실행 (Manual)
deploy_prod:
  stage: deploy
  tags:
    - jupddang
  needs: ["build_image"]
  only:
    - master
  when: manual
  allow_failure: false
  script:
    - |
      echo "🚀 Starting Deployment..."

      # 이미지 태그 갱신
      docker tag $IMAGE_NAME:$CI_COMMIT_SHORT_SHA $IMAGE_NAME:latest

      # [문법 수정] docker-compose -> docker compose (V2)
      docker compose -f $COMPOSE_FILE down backend
      docker compose -f $COMPOSE_FILE up -d backend

      # 불필요한 이미지 정리
      docker image prune -f
      
      echo "✅ Deployment Complete!"