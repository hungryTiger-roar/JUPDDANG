stages:
  - build
  - deploy

variables:
  # 이미지 이름 변수화
  IMAGE_NAME: jupddang-backend
  # Docker Compose 파일 경로
  COMPOSE_FILE: /home/gitlab-runner/app/docker-compose.yml
  # 환경 변수 파일들이 있는 루트 경로
  ENV_ROOT: /home/gitlab-runner/app

# ==================================================
# 1. Build 단계
# ==================================================
build_image:
  stage: build
  tags:
    - jupddang
  only:
    - master
    - dev
  script:
    - |
      echo "🏗️ Building Docker Image (Multi-Stage) for branch: $CI_COMMIT_REF_SLUG"
      
      # Docker Build 실행 (Dockerfile 내부에서 ./gradlew build가 실행됨)
      # --no-cache: 코드 변경 사항 강제 반영을 위해 캐시 미사용
      docker build --no-cache -t $IMAGE_NAME:$CI_COMMIT_REF_SLUG ./Backend/jupddang

# ==================================================
# 2. Deploy 단계
# ==================================================
deploy_app:
  stage: deploy
  tags:
    - jupddang
  needs: ["build_image"]
  only:
    - master
    - dev
  script:
    - |
      echo "🚀 Deploying to $CI_COMMIT_REF_SLUG Environment..."

      if [ "$CI_COMMIT_REF_SLUG" == "master" ]; then
        TARGET_ENV="${ENV_ROOT}/.env.prod"
        TARGET_SERVICE="backend-prod"
        IMAGE_TAG="prod"
      else
        TARGET_ENV="${ENV_ROOT}/.env.dev"
        TARGET_SERVICE="backend-dev"
        IMAGE_TAG="dev"
      fi

      # 1. 환경변수 파일 준비 (.env로 복사)
      cp "$TARGET_ENV" .env

      # 2. 이미지 태그 변경 (commit ref -> deploy tag)
      docker tag $IMAGE_NAME:$CI_COMMIT_REF_SLUG $IMAGE_NAME:$IMAGE_TAG

      # 3. 배포 (강제 재생성)
      # --force-recreate: 컨테이너를 새로 생성하여 새 이미지 적용 보장
      docker compose --env-file "$TARGET_ENV" -f $COMPOSE_FILE up -d --no-deps --force-recreate $TARGET_SERVICE

      # 4. 불필요한 이미지 정리
      docker image prune -f
      echo "✅ Deployment Complete!"