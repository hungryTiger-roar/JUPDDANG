stages:
  - build
  - deploy

variables:
  IMAGE_NAME: jupddang-backend
  COMPOSE_FILE: ./docker-compose.yml

# 1. Build 단계: 이미지만 생성하고 끝남 (자동 실행)
build_image:
  stage: build
  tags:
    - shell-runner
  only:
    - main
  script:
    - |
      echo "🏗️ Building Docker Image..."
      
      # .env 파일 검사
      if [ ! -f .env ]; then 
        echo "❌ Error: .env file is missing on the server!"
        exit 1
      fi

      # 이미지 빌드 (태그: 커밋 해시)
      # 이 단계에서 빌드 오류가 나면 파이프라인이 멈추므로 안전함
      docker build -t $IMAGE_NAME:$CI_COMMIT_SHORT_SHA ./Backend/jupddang

# 2. Deploy 단계: 버튼을 눌러야 실행됨 (수동 실행)
deploy_prod:
  stage: deploy
  tags:
    - shell-runner
  needs: ["build_image"] # build_image가 성공해야만 활성화됨
  only:
    - main
  when: manual # <--- 핵심: 이 옵션이 있어야 '클릭'해서 배포함
  allow_failure: false # 버튼 안 누르면 파이프라인이 '완료'되지 않고 '대기' 상태 유지
  script:
    - |
      echo "🚀 Starting Deployment..."

      # Build 단계에서 만든 이미지를 latest로 태그 갱신
      # (같은 서버의 Shell Runner이므로 이미지가 캐시되어 있어 즉시 실행됨)
      docker tag $IMAGE_NAME:$CI_COMMIT_SHORT_SHA $IMAGE_NAME:latest

      # docker-compose로 컨테이너 교체
      docker-compose -f $COMPOSE_FILE down backend
      docker-compose -f $COMPOSE_FILE up -d backend

      # 불필요한 이미지 정리
      docker image prune -f
      
      echo "✅ Deployment Complete!"