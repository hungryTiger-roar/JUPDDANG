stages:
  - build
  - deploy

variables:
  # 이미지 이름 변수화
  IMAGE_NAME: jupddang-backend
  # Docker Compose 파일 경로
  COMPOSE_FILE: /home/gitlab-runner/app/docker-compose.yml
  # 환경 변수 파일들이 있는 루트 경로
  ENV_ROOT: /home/gitlab-runner/app
  # 공통 네트워크 이름
  NETWORK_NAME: jupddang-network

# ==================================================
# 1. Build 단계
# ==================================================
build_image:
  stage: build
  tags:
    - jupddang
  only:
    - master
    - dev
  script:
    - |
      echo "🏗️ Building Docker Image (Multi-Stage) for branch: $CI_COMMIT_REF_SLUG"
      
      # Docker Build 실행 (Dockerfile 내부에서 ./gradlew build가 실행됨)
      docker build --no-cache -t $IMAGE_NAME:$CI_COMMIT_REF_SLUG ./Backend/jupddang

# ==================================================
# 2. Deploy 단계
# ==================================================
deploy_app:
  stage: deploy
  tags:
    - jupddang
  needs: ["build_image"]
  only:
    - master
    - dev
  script:
    - |
      echo "🚀 Deploying to $CI_COMMIT_REF_SLUG Environment..."

      # [1] 브랜치별 변수 설정
      if [ "$CI_COMMIT_REF_SLUG" == "master" ]; then
        TARGET_ENV="${ENV_ROOT}/.env.prod"
        TARGET_SERVICE="backend-prod"
        IMAGE_TAG="prod"
      else
        TARGET_ENV="${ENV_ROOT}/.env.dev"
        TARGET_SERVICE="backend-dev"
        IMAGE_TAG="dev"
      fi

      # [2] 환경변수 파일 준비 (.env로 복사)
      cp "$TARGET_ENV" .env

      # [3] 네트워크 자동 생성 (핵심 수정 사항)
      # 네트워크가 없으면 생성하고, 있으면 그대로 진행합니다.
      docker network inspect $NETWORK_NAME >/dev/null 2>&1 || \
      docker network create --driver bridge $NETWORK_NAME
      echo "🌐 Network '$NETWORK_NAME' is ready."

      # [4] 이미지 태그 변경 (commit ref -> deploy tag)
      docker tag $IMAGE_NAME:$CI_COMMIT_REF_SLUG $IMAGE_NAME:$IMAGE_TAG

      # [5] 배포 실행
      # --no-deps: 이미 실행 중인 DB/Redis 등을 재시작하지 않고 백엔드만 교체
      # --force-recreate: 설정 변경사항 반영을 위해 컨테이너 새로 생성
      docker compose --env-file "$TARGET_ENV" -f $COMPOSE_FILE up -d --no-deps --force-recreate $TARGET_SERVICE

      # [6] 불필요한 이미지 정리 (이전 빌드 이미지 등 삭제)
      docker image prune -f
      echo "✅ $CI_COMMIT_REF_SLUG Deployment Complete!"