spring.application.name=jupddang

# ==========================================
# 0. HTTP 인코딩 및 서버 설정 (필수)
# ==========================================
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true
# [핵심] Nginx(HTTPS) 뒤에 숨어있음을 Spring에 알림 (Swagger 500 에러 및 리다이렉트 해결)
server.forward-headers-strategy=framework

# ==========================================
# 1. JSON 변환 설정
# ==========================================
spring.jackson.time-zone=Asia/Seoul
spring.jackson.serialization.write-dates-as-timestamps=false

# ==========================================
# 2. DB 설정 (PostgreSQL)
# ==========================================
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'Asia/Seoul'; SET CLIENT_ENCODING TO 'UTF8';

# ==========================================
# 3. Redis 설정
# ==========================================
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}

# ==========================================
# 4. JPA 설정
# ==========================================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.connection.charSet=UTF-8
spring.jpa.properties.hibernate.connection.characterEncoding=UTF-8
spring.jpa.properties.hibernate.connection.useUnicode=true

# ==========================================
# 5. Google Cloud Storage & File Upload
# ==========================================
spring.cloud.gcp.project-id=jupddang
spring.cloud.gcp.credentials.location=file:${GCP_CREDENTIALS_PATH:/app/gcp-credentials.json}
spring.cloud.gcp.storage.bucket=jupddang-images

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=35MB

# ==========================================
# 6. JWT & Security
# ==========================================
jwt.secret=jjjjjjjjjjjjjjjuuuuuuuuuupppppppppdddddddddddaaang
jwt.access-exp-min=1440
jwt.issuer=jupddang

