spring.application.name=jupddang

# HTTP \uC694\uCCAD/\uC751\uB2F5\uC5D0 \uB300\uD574 UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true

# JSON \uBCC0\uD658(Jackson) \uC2DC \uD0C0\uC784\uC874 \uBC0F \uC778\uCF54\uB529 \uBB38\uC81C \uBC29\uC9C0
spring.jackson.time-zone=Asia/Seoul
spring.jackson.serialization.write-dates-as-timestamps=false

# ==========================================
# 2. DB \uC124\uC815 (PostgreSQL)
# ==========================================m
# PostgreSQL\uC740 URL \uD30C\uB77C\uBBF8\uD130\uBCF4\uB2E4 connection init sql\uC774 \uD655\uC2E4\uD569\uB2C8\uB2E4.
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# \uD074\uB77C\uC774\uC5B8\uD2B8 \uC778\uCF54\uB529\uC744 UTF-8\uB85C \uC9C0\uC815
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'Asia/Seoul'; SET CLIENT_ENCODING TO 'UTF8';

# 3. Redis \uC124\uC815
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}

# 4. JPA \uC124\uC815
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# [\uCD94\uAC00] Hibernate \uB808\uBCA8 \uC778\uCF54\uB529 \uBA85\uC2DC
spring.jpa.properties.hibernate.connection.charSet=UTF-8
spring.jpa.properties.hibernate.connection.characterEncoding=UTF-8
spring.jpa.properties.hibernate.connection.useUnicode=true

# 5. Google Cloud Storage
spring.cloud.gcp.project-id=jupddang
spring.cloud.gcp.credentials.location=file:${GCP_CREDENTIALS_PATH:/app/gcp-credentials.json}
spring.cloud.gcp.storage.bucket=jupddang-images

# 6. \uD30C\uC77C \uC5C5\uB85C\uB4DC \uC81C\uD55C 
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=35MB

# 7. JWT
jwt.secret=jjjjjjjjjjjjjjjuuuuuuuuuupppppppppdddddddddddaaang
jwt.access-exp-min=1440
jwt.issuer=jupddang

# 8. Server \uC2E0\uB8B0\uC131
server.forward-headers-strategy=framework

spring.profiles.active=local