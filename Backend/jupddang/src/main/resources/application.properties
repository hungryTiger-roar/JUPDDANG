spring.application.name=jupddang

# HTTP 요청/응답에 대해 UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true

# JSON 변환(Jackson) 시 타임존 및 인코딩 문제 방지
spring.jackson.time-zone=Asia/Seoul
spring.jackson.serialization.write-dates-as-timestamps=false

# ==========================================
# 2. DB 설정 (PostgreSQL)
# ==========================================
# PostgreSQL은 URL 파라미터보다 connection init sql이 확실합니다.
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# 클라이언트 인코딩을 UTF-8로 지정
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'Asia/Seoul'; SET CLIENT_ENCODING TO 'UTF8';

# 3. Redis 설정
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}

# 4. JPA 설정
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# [추가] Hibernate 레벨 인코딩 명시
spring.jpa.properties.hibernate.connection.charSet=UTF-8
spring.jpa.properties.hibernate.connection.characterEncoding=UTF-8
spring.jpa.properties.hibernate.connection.useUnicode=true

# 5. Google Cloud Storage
spring.cloud.gcp.project-id=jupddang
spring.cloud.gcp.credentials.location=file:${GCP_CREDENTIALS_PATH:/app/gcp-credentials.json}
spring.cloud.gcp.storage.bucket=jupddang-images

# 6. 파일 업로드 제한 
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=35MB

# 7. JWT
jwt.secret=jjjjjjjjjjjjjjjuuuuuuuuuupppppppppdddddddddddaaang
jwt.access-exp-min=1440
jwt.issuer=jupddang

# 8. Server 신뢰성
server.forward-headers-strategy=framework

spring.profiles.active=local