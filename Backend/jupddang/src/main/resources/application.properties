spring.application.name=jupddang
spring.profiles.active=local

# db \uC124\uC815
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA \uC124\uC815
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JWT
jwt.secret=jjjjjjjjjjjjjjjuuuuuuuuuupppppppppdddddddddddaaang
jwt.access-exp-min=1440
jwt.issuer=jupddang

# Google Cloud Storage
spring.cloud.gcp.project-id=jupddang
spring.cloud.gcp.credentials.location=classpath:gcp-credentials.json
spring.cloud.gcp.storage.bucket=jupddang-images

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=35MB