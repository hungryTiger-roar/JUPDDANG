spring.application.name=jupddang

# ==========================================
# 0. HTTP \uC778\uCF54\uB529 \uBC0F \uC11C\uBC84 \uC124\uC815 (\uD544\uC218)
# ==========================================
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true
# [\uD575\uC2EC] Nginx(HTTPS) \uB4A4\uC5D0 \uC228\uC5B4\uC788\uC74C\uC744 Spring\uC5D0 \uC54C\uB9BC (Swagger 500 \uC5D0\uB7EC \uBC0F \uB9AC\uB2E4\uC774\uB809\uD2B8 \uD574\uACB0)
server.forward-headers-strategy=framework

# ==========================================
# 1. JSON \uBCC0\uD658 \uC124\uC815
# ==========================================
spring.jackson.time-zone=Asia/Seoul
spring.jackson.serialization.write-dates-as-timestamps=false

# ==========================================
# 2. DB \uC124\uC815 (PostgreSQL)
# ==========================================
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'Asia/Seoul'; SET CLIENT_ENCODING TO 'UTF8';

# ==========================================
# 3. Redis \uC124\uC815
# ==========================================
spring.data.redis.host=${REDIS_HOST:jupddang-redis-dev}
spring.data.redis.port=${REDIS_PORT:6379}

# ==========================================
# 4. JPA \uC124\uC815
# ==========================================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.connection.charSet=UTF-8
spring.jpa.properties.hibernate.connection.characterEncoding=UTF-8
spring.jpa.properties.hibernate.connection.useUnicode=true

# ==========================================
# 5. Google Cloud Storage & File Upload
# ==========================================
spring.cloud.gcp.project-id=jupddang
spring.cloud.gcp.credentials.location=file:${GCP_CREDENTIALS_PATH:/app/gcp-credentials.json}
spring.cloud.gcp.storage.bucket=jupddang-images

gcs.bucket.name=${spring.cloud.gcp.storage.bucket}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=35MB

# ==========================================
# 6. JWT & Security
# ==========================================
jwt.secret=jjjjjjjjjjjjjjjuuuuuuuuuupppppppppdddddddddddaaang
jwt.access-exp-min=1440
jwt.issuer=jupddang

# [\uC911\uC694] \uBC30\uD3EC \uC2DC\uC5D4 \uD658\uACBD\uBCC0\uC218\uB85C \uC81C\uC5B4\uD558\uAE30 \uC704\uD574 \uC8FC\uC11D \uCC98\uB9AC (local\uC5D0\uC11C \uD560 \uB54C\uB9CC \uCF1C\uC138\uC694)
# spring.profiles.active=local

# swagger
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

jupddang.domain-url=https://i14d208.p.ssafy.io

# ==========================================
# 7. Actuator & Monitoring (Grafana/Prometheus \uC5F0\uB3D9)
# ==========================================
# Health, Info \uC678\uC5D0 Prometheus\uC640 Metrics \uC5D4\uB4DC\uD3EC\uC778\uD2B8\uB97C \uB178\uCD9C\uD569\uB2C8\uB2E4.
management.endpoints.web.exposure.include=health,info,prometheus,metrics

# Grafana\uC5D0\uC11C \uC5EC\uB7EC \uC778\uC2A4\uD134\uC2A4\uB97C \uAD6C\uBD84\uD558\uAE30 \uC704\uD574 \uC560\uD50C\uB9AC\uCF00\uC774\uC158 \uC774\uB984\uC744 \uD0DC\uADF8\uB85C \uBD99\uC785\uB2C8\uB2E4.
management.metrics.tags.application=${spring.application.name}

# \uD5EC\uC2A4 \uCCB4\uD06C \uC2DC \uC0C1\uC138 \uC815\uBCF4\uB97C \uBCF4\uC5EC\uC90D\uB2C8\uB2E4 (DB \uC5F0\uACB0 \uC0C1\uD0DC \uB4F1 \uD655\uC778 \uC6A9\uC774)
management.endpoint.health.show-details=always

# ==========================================
# 8. Gemini API (\uC4F0\uB808\uAE30 \uD0D0\uC9C0\uC6A9)
# ==========================================
gemini.api.key=${GMS_KEY:}
gemini.api.url=https://gms.ssafy.io/gmsapi/generativelanguage.googleapis.com/v1beta/models/gemini-2.5-pro:generateContent

# Firebase / Firestore ??
spring.cloud.gcp.firestore.enabled=false
spring.cloud.gcp.pubsub.enabled=false
spring.cloud.gcp.datastore.enabled=false