version: '3.8'

services:
  # ===========================
  # [2] Production Stack
  # ===========================
  backend-prod:
    container_name: jupddang-backend-prod
    image: jupddang-backend:prod
    env_file: .env.prod
    volumes:
      - ./gcp-credentials.json:/app/gcp-credentials.json
      - /home/gitlab-runner/logs/prod:/logs
    networks:
      - jupddang-net
    ports:
      - "127.0.0.1:50001:8080"
    depends_on:
      - db-prod
      - redis-prod

  db-prod:
    container_name: jupddang-db-prod
    image: postgis/postgis:15-3.4
    restart: always
    env_file: .env.prod
    volumes:
      - /home/gitlab-runner/data/prod/db:/var/lib/postgresql/data
    networks:
      - jupddang-net
    ports:
      - "127.0.0.1:60001:5432"

  redis-prod:
    container_name: jupddang-redis-prod
    image: redis:alpine
    command: redis-server --appendonly yes
    restart: always
    volumes:
      - /home/gitlab-runner/data/prod/redis:/data
    networks:
      - jupddang-net
    ports:
      - "127.0.0.1:60002:6379"

  # ===========================
  # [3] Development Stack
  # ===========================
  backend-dev:
    container_name: jupddang-backend-dev
    image: jupddang-backend:dev
    env_file: .env.dev
    volumes:
      - ./gcp-credentials.json:/app/gcp-credentials.json
      - /home/gitlab-runner/logs/dev:/logs
    networks:
      - jupddang-net
    ports:
      - "127.0.0.1:50003:8080"
    depends_on:
      - db-dev
      - redis-dev

  db-dev:
    container_name: jupddang-db-dev
    image: postgis/postgis:15-3.4
    restart: always
    env_file: .env.dev
    environment:
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - /home/gitlab-runner/data/dev/db:/var/lib/postgresql/data
    networks:
      - jupddang-net
    ports:
      - "127.0.0.1:60003:5432"

  redis-dev:
    container_name: jupddang-redis-dev
    image: redis:alpine
    command: redis-server --appendonly yes
    volumes:
      - /home/gitlab-runner/data/dev/redis:/data
    networks:
      - jupddang-net
    ports:
      - "127.0.0.1:60004:6379"

# [핵심 변경] infra에서 만든 'jupddang-network'라는 이름을 정확히 사용합니다.
networks:
  jupddang-net:
    external: true
    name: jupddang-network

    volumes:
      - /home/gitlab-runner/data/dev/redis:/data
    networks:
      - jupddang-net
    ports:
      - "127.0.0.1:60004:6379"

networks:
  jupddang-net:
    external: true
