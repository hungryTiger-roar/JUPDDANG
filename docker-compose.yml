version: '3.8'

services:
  # ===========================
  # [1] Infrastructure
  # ===========================
  nginx:
    container_name: jupddang-nginx
    image: nginx:latest
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /home/gitlab-runner/config/nginx/nginx.conf:/etc/nginx/nginx.conf
      - /home/gitlab-runner/config/nginx/conf.d:/etc/nginx/conf.d
    networks:
      - jupddang-net
    depends_on:
      - backend-prod
      - backend-dev

  prometheus:
    container_name: jupddang-prometheus
    image: prom/prometheus
    restart: always  
    volumes:
      - /home/gitlab-runner/config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - /home/gitlab-runner/data/prometheus:/prometheus  
    networks:
      - jupddang-net
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    container_name: jupddang-grafana
    image: grafana/grafana
    restart: always 
    environment:
      - GF_SERVER_ROOT_URL=http://localhost/monitor/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - /home/gitlab-runner/data/grafana:/var/lib/grafana
    networks:
      - jupddang-net
    ports:
      - "127.0.0.1:3000:3000"

  # ===========================
  # [2] Production Stack
  # ===========================
  backend-prod:
    container_name: jupddang-backend-prod
    build:
      context: .
      dockerfile: Dockerfile
    image: jupddang-backend:latest
    env_file: .env.prod
    volumes:
      - ./gcp-credentials.json:/app/gcp-credentials.json
      - /home/gitlab-runner/logs/prod:/logs
    networks:
      - jupddang-net
    ports:
      - "127.0.0.1:50001:8080"
    depends_on:
      - db-prod
      - redis-prod

  db-prod:
    container_name: jupddang-db-prod
    image: postgis/postgis:15-3.4
    restart: always
    env_file: .env.prod
    volumes:
      - /home/gitlab-runner/data/prod/db:/var/lib/postgresql/data
    networks:
      - jupddang-net
    ports:
      - "127.0.0.1:60001:5432"

  redis-prod:
    container_name: jupddang-redis-prod
    image: redis:alpine
    command: redis-server --appendonly yes
    restart: always
    volumes:
      - /home/gitlab-runner/data/prod/redis:/data
    networks:
      - jupddang-net
    ports:
      - "127.0.0.1:60002:6379"

  # ===========================
  # [3] Development Stack
  # ===========================
  backend-dev:
    container_name: jupddang-backend-dev
    build:
      context: .
      dockerfile: Dockerfile
    image: jupddang-backend:latest
    env_file: .env.dev
    volumes:
      - ./gcp-credentials.json:/app/gcp-credentials.json
      - /home/gitlab-runner/logs/dev:/logs
    networks:
      - jupddang-net
    ports:
      - "127.0.0.1:50003:8080"
    depends_on:
      - db-dev
      - redis-dev

  db-dev:
    container_name: jupddang-db-dev
    image: postgis/postgis:15-3.4
    restart: always
    env_file: .env.dev
    command: postgres -c 'config_file=/etc/postgresql/postgresql.conf'
    environment:
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - /home/gitlab-runner/data/dev/db:/var/lib/postgresql/data
    networks:
      - jupddang-net
    ports:
      - "127.0.0.1:60003:5432"

  redis-dev:
    container_name: jupddang-redis-dev
    image: redis:alpine
    command: redis-server --appendonly yes
    volumes:
      - /home/gitlab-runner/data/dev/redis:/data
    networks:
      - jupddang-net
    ports:
      - "127.0.0.1:60004:6379"

networks:
  jupddang-net:
    external: true
